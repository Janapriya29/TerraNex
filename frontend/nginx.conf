server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Maximum allowed size for uploaded plant leaf images (15MB)
    client_max_body_size 15M;

    # Gzip compression for production performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static file root
    root /usr/share/nginx/html;
    index index.html index.htm;

    # React SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse proxy for backend API endpoints and image uploads
    # Note: Requires trailing slash or end of string so frontend SPA routes
    # like /crop-recommendation, /disease-detection, /market-analysis are not intercepted.
    location ~ ^/(users|crop|disease|market|uploads|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
