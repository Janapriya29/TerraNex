name: Build and Push Container Images to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'models/**'
      - 'docker-compose*'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Push Multi-Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names and tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Backend Image: ghcr.io/${REPO_LOWER}-backend:latest"
          echo "Frontend Image: ghcr.io/${REPO_LOWER}-frontend:latest"

      # ------------------------------------------------------------------------
      # Build & Publish Backend Image (FastAPI + ML Models)
      # Context is repo root (.) to bundle models/ directory into /app/models
      # ------------------------------------------------------------------------
      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-backend:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-backend:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # Build & Publish Frontend Image (React SPA + Nginx Reverse Proxy)
      # Context is repo root (.) with VITE_API_BASE_URL="" for relative proxying
      # ------------------------------------------------------------------------
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-frontend:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-frontend:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
