services:
  # ============================================================================
  # MongoDB Service (Isolated Container Storage)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: terranex_mongodb
    restart: unless-stopped
    ports:
      # Host port defaults to 27018 to prevent collision with running host MongoDB
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - terranex_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - terranex_net

  # ============================================================================
  # Backend API Service (FastAPI + ML Models)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: terranex_backend
    restart: unless-stopped
    ports:
      # Host port defaults to 8002 to avoid collision with other local services
      - "${BACKEND_PORT:-8002}:8000"
    environment:
      # Connects by default to host MongoDB preserving existing records,
      # or override with mongodb://mongodb:27017/TerraNex for isolated container DB
      - MONGODB_URL=${MONGODB_URL:-mongodb://host.docker.internal:27017/TerraNex}
      - MODEL_DIR=/app/models
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:8080,http://127.0.0.1:8080,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173}
      - ENABLE_STAGE1_SPECIES=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - terranex_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - terranex_net

  # ============================================================================
  # Frontend Web Service (React SPA + Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: terranex_frontend
    restart: unless-stopped
    ports:
      # Host port defaults to 8080 to avoid collision with port 80
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - terranex_net

# ==============================================================================
# Persistent Named Storage Volumes
# ==============================================================================
volumes:
  terranex_mongodb_data:
    name: terranex_mongodb_data
  terranex_uploads:
    name: terranex_uploads

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  terranex_net:
    name: terranex_net
    driver: bridge
